<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bus Console</title>
<style>
  :root{
    --bg:#0b0e13;
    --panel:#12161d;
    --panel-2:#161b23;
    --line:rgba(255,255,255,0.07);
    --line-strong:rgba(255,255,255,0.13);
    --top-hi:inset 0 1px 0 rgba(255,255,255,0.045);
    --ink:#e7e9ec;
    --dim:#8891a0;
    --dim-2:#5a6270;
    --amber:#e8a33d;
    --teal:#4fb0a8;
    --red:#d9695f;
    --green:#6fae6a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Mono","SF Mono",Consolas,monospace;
    padding:30px;
    min-height:100vh;
  }
  .wrap{max-width:960px;margin:0 auto;}
  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:24px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
    gap:10px;
  }
  h1{
    font-size:17px;
    font-weight:500;
    letter-spacing:0.01em;
    margin:0;
    color:var(--ink);
  }
  .subtitle{color:var(--dim);font-size:12.5px;margin-top:5px;}
  .counts{display:flex;gap:18px;font-size:12.5px;flex-wrap:wrap;}
  .count b{color:var(--ink);font-weight:600;}
  .count.done b{color:var(--green);}
  .count.blocked b{color:var(--red);}
  .count.unverified b, .count.error b{color:var(--red);}
  .count.pending b{color:var(--dim);}

  .navlink{color:var(--dim);font-size:11.5px;border:1px solid var(--line);padding:4px 10px;border-radius:4px;text-decoration:none;white-space:nowrap;transition:color .15s ease,border-color .15s ease;}
  .navlink:hover{color:var(--ink);border-color:var(--line-strong);}

  .section-label, .panel-title, .feed-title{
    font-size:11px;color:var(--dim-2);letter-spacing:0.05em;
  }
  .section-label{margin:24px 0 10px;}
  .section-label:first-of-type{margin-top:0;}

  .lane{
    display:flex;
    gap:14px;
    margin-bottom:10px;
    align-items:center;
    padding:14px 18px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:5px;
    box-shadow:var(--top-hi);
    transition:border-color .3s ease, box-shadow .3s ease;
  }
  .lane.active{border-color:rgba(232,163,61,0.5);box-shadow:var(--top-hi), 0 0 0 1px rgba(232,163,61,0.12), 0 4px 16px -6px rgba(232,163,61,0.3);}
  .lane.done{opacity:0.6;}

  .icon-slot{
    width:34px;height:34px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .icon-slot svg{width:20px;height:20px;stroke:var(--dim);fill:none;stroke-width:1.6;transition:stroke .2s;}
  .lane.active .icon-slot svg{stroke:var(--amber);}
  .lane.done .icon-slot svg{stroke:var(--green);}
  .lane.blocked .icon-slot svg{stroke:var(--red);}
  .lane.error .icon-slot svg{stroke:var(--red);}
  .lane.unverified .icon-slot svg{stroke:var(--amber);}

  .pulse{
    position:absolute;
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--amber);
    opacity:0;
  }
  .lane.active .pulse{animation:pulse 1.6s ease-out infinite;}
  @keyframes pulse{
    0%{transform:scale(0.6);opacity:0.55;}
    100%{transform:scale(1.5);opacity:0;}
  }

  .mag-glass{animation:scan 2.2s ease-in-out infinite;}
  @keyframes scan{
    0%,100%{transform:translate(0,0) rotate(0deg);}
    50%{transform:translate(2px,-1px) rotate(-8deg);}
  }
  .pencil-tip{transform-origin:16px 16px;}
  .lane.active .pencil-tip{animation:write 0.9s ease-in-out infinite;}
  @keyframes write{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(-6deg) translateX(-1px);}
  }
  .gear{transform-origin:12px 12px;}
  .lane.active .gear{animation:spin 3s linear infinite;}
  @keyframes spin{ to{transform:rotate(360deg);} }
  .check-mark{stroke-dasharray:20;stroke-dashoffset:20;}
  .lane.done .check-mark{animation:draw 0.4s ease-out forwards;}
  @keyframes draw{ to{stroke-dashoffset:0;} }

  .body{flex:1;min-width:0;}
  .row1{display:flex;justify-content:space-between;gap:12px;}
  .task-name{font-size:13px;color:var(--ink);word-break:break-all;}
  .agent-tag{
    font-size:10.5px;color:var(--dim);
    padding:1.5px 7px;border:1px solid var(--line);border-radius:3px;
    white-space:nowrap;
  }
  .stage{font-size:11.5px;color:var(--dim);margin-top:4px;}
  .lane.active .stage{color:var(--amber);}
  .lane.blocked .stage, .lane.error .stage{color:var(--red);}
  .lane.unverified .stage{color:var(--amber);}
  .lane.done .stage{color:var(--green);}
  .reason{font-size:11px;color:var(--dim-2);margin-top:3px;word-break:break-word;}

  .panels{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap;}
  .panel{
    flex:1;min-width:220px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:5px;
    box-shadow:var(--top-hi);
    padding:14px 18px;
    font-size:12px;
  }
  .panel-title{margin-bottom:9px;}
  .panel .badge{display:inline-block;margin:2px 6px 2px 0;padding:1.5px 8px;border-radius:3px;font-size:11px;border:1px solid var(--line);}
  .panel .badge.ok{color:var(--green);border-color:rgba(111,174,106,0.45);}
  .panel .badge.fail{color:var(--red);border-color:rgba(217,105,95,0.45);}

  .feed{
    margin-top:24px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:5px;
    box-shadow:var(--top-hi);
    padding:15px 18px;
    font-size:11.5px;
    color:var(--dim);
    max-height:160px;
    overflow-y:auto;
  }
  .feed-title{
    margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--line);
  }
  .feed-line{margin-bottom:5px;}
  .feed-line .t{color:var(--dim-2);margin-right:8px;}
  .feed-line.new{color:var(--ink);}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>bus / live console</h1>
      <div class="subtitle">the standing /bus/ system -- live from serve-dashboard.js, polled every 2s</div>
    </div>
    <div style="display:flex;align-items:baseline;gap:18px;">
      <div class="counts" id="counts"></div>
      <a class="navlink" href="/fleet.html" target="_blank">fleet pilot &rarr;</a>
      <a class="navlink" href="/crypto.html" target="_blank">crypto pilot &rarr;</a>
      <a class="navlink" href="/agents.html" target="_blank">agent graph &rarr;</a>
      <a class="navlink" href="/markets.html" target="_blank">markets &rarr;</a>
    </div>
  </header>

  <div id="backlogSection" hidden>
    <div class="section-label">active backlog run</div>
    <div id="backlogLanes"></div>
  </div>

  <div class="section-label">in flight</div>
  <div id="inFlightLanes"></div>

  <div class="section-label">recent activity</div>
  <div id="lanes"></div>

  <div class="panels">
    <div class="panel">
      <div class="panel-title">memory store</div>
      <div id="memoryPanel">--</div>
    </div>
    <div class="panel">
      <div class="panel-title">agent configs</div>
      <div id="agentsPanel">--</div>
    </div>
  </div>

  <div class="feed">
    <div class="feed-title">log</div>
    <div id="feedLines"></div>
  </div>

</div>

<script>
// Wired to real data from serve-dashboard.js's /status.json (computed
// fresh per request by dashboard-status.js -- see that file's header)
// and, when a run-backlog.js campaign is actively running, its own
// pre-existing /backlog-status.json. No simulated sequence -- whatever
// the endpoints say is what renders, including blocked/unverified/error
// states. A poll failure is surfaced in the log feed, not hidden.

const STATUS_META = {
  done:       { icon: 'done',    label: 'done',        cls: 'done' },
  blocked:    { icon: 'blocked', label: 'blocked',      cls: 'blocked' },
  unverified: { icon: 'warn',    label: 'unverified',   cls: 'unverified' },
  error:      { icon: 'warn',    label: 'error',        cls: 'error' },
  pending:    { icon: 'pending', label: 'queued',       cls: '' },
};
function metaFor(status){
  return STATUS_META[status] || { icon: 'pending', label: status, cls: '' };
}

const ICONS = {
  research: `<svg viewBox="0 0 24 24" class="mag-glass"><circle cx="10" cy="10" r="6.5"/><line x1="15" y1="15" x2="21" y2="21"/></svg>`,
  write:    `<svg viewBox="0 0 24 24"><g class="pencil-tip"><path d="M4 20l1-4.5L15 5l3.5 3.5L8 19l-4 1z"/><line x1="13" y1="7" x2="16.5" y2="10.5"/></g></svg>`,
  verify:   `<svg viewBox="0 0 24 24"><g class="gear"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></g></svg>`,
  done:     `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-opacity="0.4"/><path class="check-mark" d="M7 12.5l3 3 7-7"/></svg>`,
  blocked:  `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="8" y1="8" x2="16" y2="16"/></svg>`,
  warn:     `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="7.5" x2="12" y2="13"/><circle cx="12" cy="16.5" r="0.9" fill="currentColor" stroke="none"/></svg>`,
  pending:  `<svg viewBox="0 0 24 24" stroke-opacity="0.5"><circle cx="12" cy="12" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>`
};

const STAGE_LABEL = {
  research: "researching -- fetching data",
  write: "writing output",
  verify: "verifying output shape",
};

const countsEl = document.getElementById("counts");
const lanesEl = document.getElementById("lanes");
const inFlightEl = document.getElementById("inFlightLanes");
const backlogSection = document.getElementById("backlogSection");
const backlogLanesEl = document.getElementById("backlogLanes");
const memoryPanel = document.getElementById("memoryPanel");
const agentsPanel = document.getElementById("agentsPanel");
const feedEl = document.getElementById("feedLines");

let seenLogTimestamps = new Set();

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
}

function renderCounts(statusCounts){
  const counts = (statusCounts && statusCounts.counts) || {};
  const total = (statusCounts && statusCounts.total) || 0;
  const parts = Object.keys(counts).sort().map(status =>
    `<div class="count ${escapeHtml(status)}"><b>${counts[status]}</b> ${escapeHtml(status)}</div>`
  );
  parts.push(`<div class="count"><b>${total}</b> total</div>`);
  countsEl.innerHTML = parts.join("");
}

// In-flight tasks (currently dispatching, no bus/log.md entry yet --
// see dashboard-status.js's getInFlightTasks()). Only a task_id is
// known at this point, nothing richer.
function renderInFlight(taskIds){
  inFlightEl.innerHTML = "";
  if (!taskIds || taskIds.length === 0) {
    inFlightEl.innerHTML = `<div class="lane" style="opacity:0.5"><div class="icon-slot">${ICONS.pending}</div><div class="body"><div class="stage">nothing in flight</div></div></div>`;
    return;
  }
  taskIds.forEach(id => {
    const lane = document.createElement("div");
    lane.className = "lane active";
    lane.innerHTML = `
      <div class="icon-slot"><div class="pulse"></div>${ICONS.research}</div>
      <div class="body">
        <div class="row1"><div class="task-name">${escapeHtml(id)}</div></div>
        <div class="stage">dispatching...</div>
      </div>`;
    inFlightEl.appendChild(lane);
  });
}

// Recent activity (from bus/log.md, most recent first).
function renderActivity(items){
  lanesEl.innerHTML = "";
  const ordered = (items || []).slice().reverse();
  if (ordered.length === 0) {
    lanesEl.innerHTML = `<div class="lane" style="opacity:0.5"><div class="body"><div class="stage">no activity recorded yet</div></div></div>`;
    return;
  }
  ordered.forEach(item => {
    const meta = metaFor(item.status);
    const lane = document.createElement("div");
    lane.className = "lane" + (meta.cls ? " " + meta.cls : "");
    lane.innerHTML = `
      <div class="icon-slot">${ICONS[meta.icon] || ICONS.pending}</div>
      <div class="body">
        <div class="row1">
          <div class="task-name">${escapeHtml(item.taskId)}</div>
          <div class="agent-tag">${escapeHtml(item.via)}</div>
        </div>
        <div class="stage">${escapeHtml(meta.label)}</div>
        ${item.reason ? `<div class="reason">${escapeHtml(item.reason)}</div>` : ''}
      </div>`;
    lanesEl.appendChild(lane);
  });
}

function renderMemory(memory){
  if (!memory || memory.keyCount === 0) {
    memoryPanel.textContent = "no facts recorded yet";
    return;
  }
  const recent = memory.mostRecent;
  memoryPanel.innerHTML = `${memory.keyCount} key(s), ${memory.totalEntries} recorded fact(s)` +
    (recent ? `<br><span style="color:var(--dim)">most recent: "${escapeHtml(recent.key)}"</span>` : '');
}

function renderAgents(agents){
  if (!agents || agents.length === 0) {
    agentsPanel.textContent = "(none configured)";
    return;
  }
  agentsPanel.innerHTML = agents.map(a =>
    `<span class="badge ${a.ok ? 'ok' : 'fail'}">${escapeHtml(a.id)}${a.ok ? '' : ' FAIL'}</span>`
  ).join("");
}

// Active backlog-run panel (run-backlog.js, pre-existing) -- shown only
// while /status.json says a run is fresh (updated in the last 5 min);
// hidden otherwise rather than showing stale progress from a finished
// or abandoned run.
function renderBacklog(backlogRun, backlogItems){
  if (!backlogRun) {
    backlogSection.hidden = true;
    return;
  }
  backlogSection.hidden = false;
  backlogLanesEl.innerHTML = "";
  (backlogItems || []).forEach(t => {
    const lane = document.createElement("div");
    const cls = t.status === "pending" ? "" : (["research","write","verify"].includes(t.status) ? "active" : t.status);
    lane.className = "lane" + (cls ? " " + cls : "");
    lane.innerHTML = `
      <div class="icon-slot">
        <div class="pulse"></div>
        ${ICONS[t.status] || ICONS.pending}
      </div>
      <div class="body">
        <div class="row1">
          <div class="task-name">${escapeHtml(t.name)}</div>
          <div class="agent-tag">${escapeHtml(t.agent)}</div>
        </div>
        <div class="stage">${STAGE_LABEL[t.status] || t.status}${t.status !== t.realStatus ? ' (' + escapeHtml(t.realStatus) + ')' : ''}</div>
      </div>
    `;
    backlogLanesEl.appendChild(lane);
  });
}

function appendLogLine(ts, msg){
  const key = ts + "|" + msg;
  if (seenLogTimestamps.has(key)) return;
  seenLogTimestamps.add(key);
  const line = document.createElement("div");
  line.className = "feed-line new";
  const time = new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  line.innerHTML = `<span class="t">${time}</span>${escapeHtml(msg)}`;
  feedEl.appendChild(line);
  feedEl.scrollTop = feedEl.scrollHeight;
  setTimeout(()=>line.classList.remove("new"), 800);
}

async function poll(){
  try {
    const res = await fetch('status.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    renderCounts(data.statusCounts);
    renderInFlight(data.inFlight);
    renderActivity(data.recentActivity);
    renderMemory(data.memory);
    renderAgents(data.agents);

    (data.recentActivity || []).forEach(item => {
      appendLogLine(data.generatedAt, `${item.status} -- ${item.taskId}${item.reason ? ' (' + item.reason + ')' : ''}`);
    });

    if (data.backlogRun) {
      const backlogRes = await fetch('backlog-status.json', { cache: 'no-store' });
      const backlogData = backlogRes.ok ? await backlogRes.json() : {};
      renderBacklog(data.backlogRun, backlogData.items || []);
    } else {
      renderBacklog(null, []);
    }
  } catch (err) {
    appendLogLine(new Date().toISOString(), 'poll failed: ' + err.message + ' (is serve-dashboard.js running?)');
  }
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
