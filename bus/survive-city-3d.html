<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survive City</title>
<style>
  :root{
    --paper:#fbfaf7; --paper-2:#f2efe8; --line:rgba(30,35,45,0.10); --line-2:rgba(30,35,45,0.18);
    --ink:#22262e; --ink-2:#5b6270; --ink-3:#8a90a0;
    --green:#3f8f5a; --amber:#c98a1b; --teal:#2f8f96; --red:#c4473e; --purple:#6f5bb5; --orange:#d07a2f;
    --shadow:0 6px 24px rgba(30,35,45,0.12), 0 1px 2px rgba(30,35,45,0.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:#cfe3f5;color:var(--ink);font-family:"Inter","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 22px;background:var(--paper);border-bottom:1px solid var(--line);flex-shrink:0;}
  h1{font-size:16px;font-weight:600;letter-spacing:0.01em;margin:0;}
  .subtitle{color:var(--ink-2);font-size:12.5px;margin-top:3px;max-width:900px;}
  .nav{display:flex;gap:8px;flex-shrink:0;}
  .navlink{color:var(--ink-2);font-size:12px;border:1px solid var(--line-2);background:#fff;padding:5px 10px;border-radius:6px;text-decoration:none;white-space:nowrap;}
  .navlink:hover{color:var(--ink);border-color:var(--ink-3);}
  .main{flex:1;position:relative;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;}
  .panel{position:absolute;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);font-size:12px;color:var(--ink-2);}
  .legend{top:14px;left:14px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;max-width:250px;pointer-events:none;}
  .legend .row{display:flex;align-items:center;gap:8px;}
  .legend .ic{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0;font-weight:700;}
  .roster{top:14px;right:14px;padding:10px 12px;min-width:220px;max-width:290px;max-height:calc(100% - 100px);overflow:auto;pointer-events:none;}
  .roster h2{font-size:11px;font-weight:600;color:var(--ink-3);margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;}
  .roster .stat{display:flex;justify-content:space-between;gap:12px;padding:2px 0;}
  .roster .stat b{color:var(--ink);font-weight:600;}
  .roster .cit{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--line);}
  .roster .cit .id{color:var(--ink);font-weight:500;}
  .st-idle{color:var(--ink-3);} .st-researching{color:var(--amber);} .st-in-position{color:var(--teal);} .st-blocked{color:var(--orange);} .st-kia{color:var(--ink-3);} .st-quarantined{color:var(--red);}
  .pos{color:var(--green);} .neg{color:var(--red);}
  .timebar{left:50%;bottom:16px;transform:translateX(-50%);padding:8px 12px;display:flex;align-items:center;gap:10px;pointer-events:auto;}
  .timebar .clock{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);min-width:58px;}
  .timebar input[type=range]{width:220px;accent-color:var(--amber);}
  .timebar button{font:inherit;font-size:11.5px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);border-radius:6px;padding:4px 9px;cursor:pointer;}
  .timebar button.live{border-color:var(--green);color:var(--green);font-weight:600;}
  .note{position:absolute;right:14px;bottom:16px;max-width:300px;font-size:11px;color:var(--ink-2);background:rgba(251,250,247,0.85);padding:5px 9px;border-radius:6px;pointer-events:none;}
  .banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:7px 13px;font-size:12.5px;color:var(--ink-2);pointer-events:none;white-space:nowrap;}
  @media (max-width:760px){ .roster,.subtitle{display:none;} .timebar input[type=range]{width:130px;} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>

<header>
  <div>
    <h1>Survive City</h1>
    <div class="subtitle">The city-bank economy as a real town. One landmark building per revenue mechanism, a house for every citizen, the Bank on the square. Citizens walk the streets to wherever they're working right now. Lighting follows your local time of day.</div>
  </div>
  <div class="nav">
    <a class="navlink" href="/economy.html" target="_blank">plain view →</a>
    <a class="navlink" href="/" target="_blank">console →</a>
  </div>
</header>

<div class="main">
  <canvas id="c"></canvas>
  <div class="panel legend" id="legend"></div>
  <div class="panel roster" id="roster"></div>
  <div class="banner" id="banner" hidden></div>
  <div class="banner" id="follow" style="top:auto;bottom:64px" hidden></div>
  <div class="panel timebar">
    <span class="clock" id="clock">--:--</span>
    <input type="range" id="scrub" min="0" max="1439" step="1" value="720" aria-label="time of day">
    <button id="liveBtn" class="live" title="follow the real clock">live</button>
  </div>
  <div class="note" id="note"></div>
</div>

<script type="module">
// Survive City -- round 9 rebuild (ARCHITECTURE.md section 19).
// A bright, stylized low-poly town whose every visible thing is real data
// from /survive-city-3d-status.json. Two loops, as everywhere in this
// dashboard: poll() only updates targets; renderLoop() runs every frame.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';

const $ = (id) => document.getElementById(id);
const canvas = $('c');

// ============================================================ CONFIG
const CFG = {
  latitudeDeg: 37,            // assumed viewer latitude for the sun path (mid-latitude US)
  terrainSize: 420, terrainSegs: 160,
  flatHalf: 92,               // ground is flat inside this square half-size (the town), hills begin beyond flatHalf+40
  shadowMap: 2048,
};
const PAL = {
  grass: [0x8fb573, 0x9dbd7c, 0x84ad6c, 0xa3c286],
  grassDry: 0xb5bd7a,
  hill: 0x8aa86e,
  skyDay: 0xcfe3f5, skyDusk: 0xf4b98a, skyNight: 0x0f1626,
  fogDay: 0xd6e6f4, fogDusk: 0xe8b08f, fogNight: 0x131b2c,
  sunWarm: 0xfff1d6, sunLow: 0xffb070, moon: 0x9fb4d8,
  hemiSky: 0xbfdcff, hemiGround: 0x9a8f6e,
};

// ============================================================ TIME ENGINE
// Real local clock by default; the scrubber or ?t=HH:MM overrides it.
const timeEngine = {
  override: null, // minutes since midnight, or null = live
  minutesNow() {
    if (this.override != null) return this.override;
    const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  },
  dayOfYear() { const d = new Date(); return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000); },
  // Simple solar model: declination from day-of-year, hour angle from local
  // clock (equation-of-time/longitude offsets ignored on purpose -- this is
  // a town, not an almanac). Returns elevation/azimuth in radians and a
  // unit direction vector pointing FROM the scene TOWARD the sun.
  sun() {
    const lat = THREE.MathUtils.degToRad(CFG.latitudeDeg);
    const decl = THREE.MathUtils.degToRad(23.44) * Math.sin(2 * Math.PI * (284 + this.dayOfYear()) / 365);
    const H = THREE.MathUtils.degToRad(15 * (this.minutesNow() / 60 - 12));
    const sinEl = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(H);
    const el = Math.asin(THREE.MathUtils.clamp(sinEl, -1, 1));
    const cosAz = (Math.sin(decl) - Math.sin(el) * Math.sin(lat)) / (Math.cos(el) * Math.cos(lat) || 1e-6);
    let az = Math.acos(THREE.MathUtils.clamp(cosAz, -1, 1));
    if (H > 0) az = 2 * Math.PI - az; // afternoon: west of south
    const dir = new THREE.Vector3(Math.cos(el) * Math.sin(az), Math.sin(el), -Math.cos(el) * Math.cos(az));
    return { el, az, dir };
  },
};
{
  const m = /[?&]t=(\d{1,2}):(\d{2})/.exec(location.search);
  if (m) timeEngine.override = Number(m[1]) * 60 + Number(m[2]);
}
const scrub = $('scrub'), clockEl = $('clock'), liveBtn = $('liveBtn');
scrub.addEventListener('input', () => { timeEngine.override = Number(scrub.value); liveBtn.classList.remove('live'); });
liveBtn.addEventListener('click', () => { timeEngine.override = null; liveBtn.classList.add('live'); });
if (timeEngine.override != null) { liveBtn.classList.remove('live'); scrub.value = Math.floor(timeEngine.override); }
function fmtClock(mins) { const h = Math.floor(mins / 60) % 24, m = Math.floor(mins % 60); return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; }

// ============================================================ RENDERER / CAMERA
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PAL.fogDay, 120, 260);

const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 900);
camera.position.set(52, 24, 72);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.autoRotate = false; // was a fixed ambient rotation around the town center -- fought against actually exploring the town, removed
controls.minPolarAngle = 1.0; controls.maxPolarAngle = 1.47; // low, grounded: never top-down, never below the ground
controls.minDistance = 10; controls.maxDistance = 170;
controls.enablePan = true; controls.screenSpacePanning = false; // ground-plane panning: drag up/down always moves forward/back across the town, independent of camera tilt (screen-space panning tilts the pan vector with the view angle instead -- not what you want when looking down at an angle)
// Drag-to-explore, not orbit-around-a-fixed-point: left-drag PANS across
// the town (so any corner, e.g. the security office, is reachable by
// dragging), right-drag rotates the view, scroll/pinch zooms. This is the
// direct fix for "click and drag doesn't let me see the security office"
// -- the old default (left-drag orbits around a pinned target at the
// town center) couldn't get a far corner into frame without zooming out
// so far the town became tiny.
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };

function resize() {
  const w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h, false);
}
window.addEventListener('resize', resize);

// ============================================================ SKY, SUN, MOON, STARS
const sky = new Sky();
sky.scale.setScalar(4000);
scene.add(sky);
const skyU = sky.material.uniforms;
skyU.turbidity.value = 6; skyU.rayleigh.value = 2.2; skyU.mieCoefficient.value = 0.006; skyU.mieDirectionalG.value = 0.8;

const hemi = new THREE.HemisphereLight(PAL.hemiSky, PAL.hemiGround, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(PAL.sunWarm, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(CFG.shadowMap, CFG.shadowMap);
sun.shadow.camera.near = 10; sun.shadow.camera.far = 400;
sun.shadow.camera.left = -105; sun.shadow.camera.right = 105; sun.shadow.camera.top = 105; sun.shadow.camera.bottom = -105;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
scene.add(sun); scene.add(sun.target);

const moon = new THREE.DirectionalLight(PAL.moon, 0);
moon.castShadow = true;
moon.shadow.mapSize.set(1024, 1024);
moon.shadow.camera.near = 10; moon.shadow.camera.far = 400;
moon.shadow.camera.left = -90; moon.shadow.camera.right = 90; moon.shadow.camera.top = 90; moon.shadow.camera.bottom = -90;
moon.shadow.bias = -0.0006;
scene.add(moon); scene.add(moon.target);
const moonDisc = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 12), new THREE.MeshBasicMaterial({ color: 0xe9eef7, fog: false }));
scene.add(moonDisc);

const stars = (() => {
  const n = 900, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const r = 700, th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 0.95);
    p[i*3] = r * Math.sin(ph) * Math.cos(th); p[i*3+1] = r * Math.cos(ph); p[i*3+2] = r * Math.sin(ph) * Math.sin(th); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const m = new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, transparent: true, opacity: 0, fog: false, sizeAttenuation: true, depthWrite: false });
  return new THREE.Points(g, m);
})();
scene.add(stars);

// Smooth keyframes on sun elevation (radians): night < -0.14, dusk band around 0, full day > 0.35.
const lerpColor = (a, b, t, out) => out.copy(a).lerp(b, t);
const cA = new THREE.Color(), cB = new THREE.Color(), cTmp = new THREE.Color();
const K = { day: new THREE.Color(PAL.fogDay), dusk: new THREE.Color(PAL.fogDusk), night: new THREE.Color(PAL.fogNight) };
const lighting = { dayFactor: 1, nightFactor: 0, duskFactor: 0 };
function updateSkyAndLights() {
  const { el, dir } = timeEngine.sun();
  const day = THREE.MathUtils.smoothstep(el, -0.05, 0.3);      // 0 at/below horizon -> 1 in full day
  const night = 1 - THREE.MathUtils.smoothstep(el, -0.2, -0.02); // 1 deep night -> 0 by civil dawn
  const dusk = Math.max(0, 1 - Math.abs(el) / 0.22) * (1 - night); // peaks at the horizon
  lighting.dayFactor = day; lighting.nightFactor = night; lighting.duskFactor = dusk;

  // Sky shader: keep the sun at/above a tiny elevation so the shader's horizon glow reads at dusk;
  // hand over to a flat night tint via exposure + fog once fully dark.
  const skySun = dir.clone(); if (skySun.y < 0.012) skySun.y = 0.012; skySun.normalize();
  skyU.sunPosition.value.copy(skySun);
  skyU.turbidity.value = 4 + dusk * 8;
  skyU.rayleigh.value = 1.4 + dusk * 2.5;
  skyU.mieCoefficient.value = 0.004 + dusk * 0.02;
  renderer.toneMappingExposure = 0.34 + day * 0.32 + dusk * 0.05 - night * 0.06;

  // Fog/horizon color
  lerpColor(K.night, K.dusk, 1 - night, cA); lerpColor(cA, K.day, day, cTmp);
  scene.fog.color.copy(cTmp);
  scene.fog.near = 110 + day * 30; scene.fog.far = 240 + day * 60;

  // Sun
  sun.position.copy(dir).multiplyScalar(220);
  sun.intensity = 2.6 * day;
  sun.color.set(PAL.sunWarm).lerp(new THREE.Color(PAL.sunLow), THREE.MathUtils.clamp(1 - el / 0.5, 0, 1) * 0.8);
  sun.visible = el > -0.02;

  // Moon: opposite the sun in azimuth, always up at night
  const moonDir = new THREE.Vector3(-dir.x, Math.max(0.35, -dir.y + 0.3), -dir.z).normalize();
  moon.position.copy(moonDir).multiplyScalar(220);
  moon.intensity = 0.7 * night;
  moon.visible = night > 0.02;
  moonDisc.position.copy(moonDir).multiplyScalar(650);
  moonDisc.material.opacity = 1; moonDisc.visible = night > 0.05;

  // Ambient bounce
  hemi.intensity = 0.4 + day * 0.6 + dusk * 0.1;
  hemi.color.set(PAL.hemiSky).lerp(new THREE.Color(0x4a5878), night);
  hemi.groundColor.set(PAL.hemiGround).lerp(new THREE.Color(0x2a3040), night);

  stars.material.opacity = 0.9 * night;
}

// ============================================================ TERRAIN
// Gently rolling low-poly ground, flattened under the town, vertex-colored grass.
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) { return vnoise(x, y) * 0.6 + vnoise(x * 2.1 + 5, y * 2.1 + 3) * 0.28 + vnoise(x * 4.3 + 9, y * 4.3 + 7) * 0.12; }
function terrainHeight(x, z) {
  const r = Math.max(Math.abs(x), Math.abs(z));
  const rise = THREE.MathUtils.smoothstep(r, CFG.flatHalf, CFG.flatHalf + 70); // flat under the town, gentle hills beyond
  const n = fbm(x * 0.016, z * 0.016);
  return rise * (n * 7.5 + 0.8) - (1 - rise) * 0.0;
}
const terrain = (() => {
  const g = new THREE.PlaneGeometry(CFG.terrainSize, CFG.terrainSize, CFG.terrainSegs, CFG.terrainSegs);
  g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, colors = new Float32Array(pos.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const y = terrainHeight(x, z); pos.setY(i, y);
    const t = vnoise(x * 0.06 + 11, z * 0.06 + 17);
    c.set(PAL.grass[Math.floor(t * PAL.grass.length) % PAL.grass.length]);
    if (y > 4) c.lerp(new THREE.Color(PAL.hill), THREE.MathUtils.clamp((y - 4) / 5, 0, 0.6));
    if (t > 0.72 && Math.max(Math.abs(x), Math.abs(z)) > CFG.flatHalf) c.lerp(new THREE.Color(PAL.grassDry), 0.4);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, flatShading: true }));
  m.receiveShadow = true;
  return m;
})();
scene.add(terrain);

// ============================================================ MATERIALS & HELPERS
const matCache = new Map();
function mat(color, { rough = 0.92, flat = false, emissive = 0x000000, ei = 0 } = {}) {
  const k = `${color}|${rough}|${flat}|${emissive}|${ei}`;
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0, flatShading: flat, emissive, emissiveIntensity: ei }));
  return matCache.get(k);
}
function box(w, h, d, color, opts) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts)); m.castShadow = true; m.receiveShadow = true; return m; }
function at(mesh, x, y, z) { mesh.position.set(x, y, z); return mesh; }
function seeded(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function strHash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// Text on a physical sign board (a plane, mounted on a facade -- not a billboard sprite).
function makeTextTexture(text, { fg = '#22262e', bg = '#fbfaf7', px = 64, pad = 28, font = '600 %dpx Inter, "Segoe UI", system-ui, sans-serif' } = {}) {
  const c = document.createElement('canvas'); const ctx = c.getContext('2d');
  ctx.font = font.replace('%d', px);
  const w = Math.ceil(ctx.measureText(text).width) + pad * 2, h = px + pad * 1.4;
  c.width = w; c.height = h;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  ctx.font = font.replace('%d', px); ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillText(text, w / 2, h / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return { texture: t, aspect: w / h };
}
function makeSignBoard(text, { height = 0.9, fg, bg = '#2b3040', frame = 0xe8dcc0, glow = false } = {}) {
  const { texture, aspect } = makeTextTexture(text, { fg: fg || '#fbf6ea', bg, px: 64 });
  const w = height * aspect;
  const g = new THREE.Group();
  const back = box(w + 0.3, height + 0.3, 0.16, frame); back.position.z = -0.02; g.add(back);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w, height), new THREE.MeshStandardMaterial({ map: texture, roughness: 0.6, emissive: 0xffffff, emissiveMap: texture, emissiveIntensity: 0 }));
  face.position.z = 0.07; g.add(face);
  g.userData.signFace = face; g.userData.width = w + 0.3;
  signFaces.push(face);
  return g;
}
const signFaces = []; // lit at night

// ============================================================ CITY PLAN
const PLAN = {
  BLOCK: 20, SW: 2.6, ROAD: 7.4, N: 2, // buildable block, sidewalk width, asphalt width, grid extent (-N..N)
};
PLAN.P = PLAN.BLOCK + 2 * PLAN.SW + PLAN.ROAD;   // block pitch
PLAN.S = PLAN.BLOCK + 2 * PLAN.SW;               // pavement plate size
PLAN.EDGE = (PLAN.N + 0.5) * PLAN.P;             // centerline of the outer ring road
const blockCenter = (bx, bz) => new THREE.Vector3(bx * PLAN.P, 0, bz * PLAN.P);

// Fixed civic core + growth lots. Mechanisms take the west avenue (closest to the square first);
// residential blocks fill east/south in order; cemetery and security sit at the far corners.
const LOTS = {
  square: [0, 0], bank: [0, -1], cityHall: [1, 0],
  mechanism: [[-1, 0], [-1, -1], [-1, 1], [-2, 0], [-2, -1], [-2, 1]],
  residential: [[0, 1], [1, 1], [1, -1], [2, 0], [0, -2], [2, 1], [2, -1], [1, -2], [-1, -2], [-1, 2], [0, 2], [1, 2]],
  cemetery: [-2, 2], security: [2, 2], park2: [-2, -2], park3: [2, -2],
};
const Y = { asphalt: 0.10, curb: 0.26, plate: 0.24 }; // heights: road surface, top of sidewalk

  const cab = box(1.2, 1.0, 1.0, 0x4b5563); at(cab, w / 2 + 1.6, floors * FLOOR_H + 7.9, -d / 2 - 1.2); g.add(cab);

function makeVault() {
  const g = new THREE.Group(), W = 13, D = 11, STONE = 0x9a8f78;

  // A single solid box here would bury the shelf rack inside opaque rock
  // with zero line of sight to it from any angle, ever (confirmed live via
  // an interior-camera screenshot during verification: pure black, camera
  // literally inside the filled geometry). The left wall is deliberately
  // left open -- the glass pane below fills that gap, the real "window."
  const floorSlab = box(W - 0.2, 0.12, D - 0.2, 0xe6e1d6); floorSlab.castShadow = false; at(floorSlab, 0, 0.76, 0); g.add(floorSlab);

  const backWall = box(W, 6.4, 0.3, STONE); at(backWall, 0, 0.7 + 3.2, -D / 2 + 0.15); g.add(backWall);
  const frontWall = box(W, 6.4, 0.3, STONE); at(frontWall, 0, 0.7 + 3.2, D / 2 - 0.15); g.add(frontWall);
  const rightWall = box(0.3, 6.4, D, STONE); at(rightWall, W / 2 - 0.15, 0.7 + 3.2, 0); g.add(rightWall);

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.5, 16), mat(0x6b6f78)); hub.rotation.x = Math.PI / 2; at(hub, 0, 0.7 + 2.6, D / 2 + 0.4); g.add(hub);
  for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; const spoke = box(1.4, 0.14, 0.1, 0x6b6f78); spoke.rotation.z = a; at(spoke, Math.cos(a) * 0.8, 0.7 + 2.6 + Math.sin(a) * 0.8, D / 2 + 0.38); g.add(spoke); }

  const dt = Math.min(clock.getDelta(), 0.1);
  updateSkyAndLights();
  const mins = timeEngine.minutesNow();
  // Night lighting: windows, lamps and sign boards come on as the sun drops (with the dusk band, not a hard switch)
  const lit = THREE.MathUtils.clamp(1 - THREE.MathUtils.smoothstep(lighting.dayFactor, 0.15, 0.6), 0, 1);
  for (const w of nightWindows) w.material.emissiveIntensity = 1.6 * lit;
  for (const h of lampHeads) h.material.emissiveIntensity = 2.2 * lit;
  for (const f of signFaces) f.material.emissiveIntensity = 0.9 * lit;
  // City Hall clock shows the real (or scrubbed) time
  if (cityHallClock.hour) { cityHallClock.hour.rotation.z = -((mins % 720) / 720) * Math.PI * 2; cityHallClock.minute.rotation.z = -((mins % 60) / 60) * Math.PI * 2; }
  if (fountainWater) fountainWater.material.opacity = 0.82 + Math.sin(clock.elapsedTime * 2.1) * 0.06;
  updateCitizens(dt, clock.elapsedTime);
  updateGuards(dt);
  const txt = fmtClock(mins);
  if (txt !== lastClockText) { clockEl.textContent = txt; lastClockText = txt; if (timeEngine.override == null) scrub.value = Math.floor(mins); }
  controls.update();
  renderer.render(scene, camera);
}

computeGuardPatrolWorld();
resize(); poll(); setInterval(poll, 2000); renderLoop();
</script>
